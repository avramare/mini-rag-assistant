[project]
name = "mini-rag"
version = "0.1.0"
description = "Small RAG assistant used as a test bed for QA and LLM eval practices"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "langfuse>=3",
    "numpy>=2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mini_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # lets tests import shared helpers as `tests.helpers`
addopts = "-m 'not eval' --strict-markers"
markers = [
    "security: authorization boundaries and prompt injection (FakeLLM + real retrieval)",
    "eval: regression gate against real models; needs Ollama + Langfuse",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
